services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mesq-clinicminds-app
    env_file:
      - .env.docker
    ports:
      - '3020:3000'
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm run start"

  mysql:
    image: mysql:8.4
    container_name: mesq-clinicminds-mysql
    restart: unless-stopped
    command: --sort-buffer-size=8M
    environment:
      MYSQL_DATABASE: mesq_cm_reporting
      MYSQL_USER: mesqadmin
      MYSQL_PASSWORD: mesqadmin
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3326:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-proot']
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
